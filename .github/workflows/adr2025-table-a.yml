name: ADR 2025 Table A ingestion tests

on:
  push:
    branches: [agent1/adr2025-table-a-ingestion]
    paths:
      - 'scripts/ingest_adr2025_table_a.py'
      - '.github/workflows/adr2025-table-a.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ingest_adr2025_table_a.py'
      - '.github/workflows/adr2025-table-a.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate-code:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile scripts/ingest_adr2025_table_a.py
      - name: Synthetic parser/corrigendum tests
        run: python scripts/ingest_adr2025_table_a.py --self-test
      - name: Existing clause register consistency
        run: python scripts/validate_adr2025_kb.py

  extract-operator-invoked:
    if: github.event_name == 'workflow_dispatch'
    needs: validate-code
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF extraction dependencies
        run: python -m pip install 'PyMuPDF==1.26.4' 'pdfplumber==0.11.7' 'requests==2.32.5'
      - name: Extract source and produce provisional, NOT approved outputs
        run: python scripts/ingest_adr2025_table_a.py --download
      - name: Upload local-review files (not a Git commit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adr2025-table-a-provisional-review
          path: regulations/adr/2025/generated/
          if-no-files-found: warn
      # Intentionally NO automatic commit of copyrighted UN Table A content
      # into this publicly visible repository. Check redistribution rights.
