name: ADR 2025 agent file ownership
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check agent file ownership
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/adr_changed_paths.txt
          python tests/integration/check_ownership.py --branch "$HEAD_BRANCH" --files /tmp/adr_changed_paths.txt
