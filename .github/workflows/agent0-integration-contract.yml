name: Agent 0 integration contract (synthetic only)
on:
  push:
    paths:
      - 'integration/agent0/**'
      - '.github/workflows/agent0-integration-contract.yml'
  pull_request:
    paths:
      - 'integration/agent0/**'
      - '.github/workflows/agent0-integration-contract.yml'
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'jsonschema>=4.21,<5'
      - run: python -m unittest discover -s integration/agent0/tests -p 'test_*.py' -v
      - run: python -m py_compile integration/agent0/orchestrator.py
